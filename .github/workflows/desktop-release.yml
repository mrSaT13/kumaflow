name: Desktop Release (exe)

# Сборка ПК-плеера: пушим тег v* (например v1.14.1) — GitHub сам собирает
# и публикует релиз с exe (x64 + arm64) и latest.yml для автообновления.
# Идентично локальной сборке: electron-vite build -> electron-builder --win.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    # windows-2022: VS 2022 с компонентом VC.Tools.ARM64 — node-gyp 11.5
    # из проекта его понимает. windows-latest ушёл на VS 2026 ("18"),
    # которую node-gyp не знает: x64 собирается, arm64 падает.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Защита от «тег не совпадает с версией в package.json» — exe
      # будет носить версию из package.json, расхождений не должно быть.
      - name: Version guard (tag == package.json)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'
          if ("v$ver" -ne $tag) {
            Write-Error "Tag $tag does not match package.json version $ver. Bump version and re-tag."
          }

      - name: Fix Windows line endings # node-gyp/pnpm могут ругаться на CRLF
        run: git config --global core.autocrlf false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: pwsh

      - name: Build renderer + main (electron-vite)
        run: pnpm run electron:build

      # electron-builder'овский внутренний npmRebuild гоняет ОБЕ арки подряд
      # (флаг --x64 игнорирует) и падает на arm64 из-за файл-локов.
      # Поэтому: нативные модули пересобираем сами по одной арке
      # (install-app-deps --arch), а сборку делаем с npmRebuild=false.
      - name: Rebuild native deps (x64)
        run: pnpm exec electron-builder install-app-deps --arch x64

      - name: Build and publish x64 (electron-builder -> GitHub Release)
        run: pnpm exec electron-builder -c.npmRebuild=false --win --publish always --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop stale MSBuild and clean native build dirs
        shell: pwsh
        run: |
          taskkill /F /IM MSBuild.exe /IM VCTip.exe /IM cl.exe 2>$null | Out-Null
          foreach ($p in 'bufferutil', 'utf-8-validate', 'register-scheme') {
            Get-ChildItem 'node_modules\.pnpm' -Directory -Filter "$p@*" | ForEach-Object {
              $b = Join-Path $_.FullName "node_modules\$p\build"
              if (Test-Path $b) { Remove-Item $b -Recurse -Force }
              Write-Host "cleaned $b"
            }
          }

      - name: Rebuild native deps (arm64)
        run: pnpm exec electron-builder install-app-deps --arch arm64

      - name: Build and publish arm64 (electron-builder -> GitHub Release)
        run: pnpm exec electron-builder -c.npmRebuild=false --win --publish always --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder публикует в DRAFT; для автообновлений (latest.yml)
      # релиз должен быть опубликован — переводим из черновика.
      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
