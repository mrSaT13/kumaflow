<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0620">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KumaFlow">
  <title>KumaFlow Remote</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root {
      --bg0: #0b0620; --bg1: #141031; --bg2: #1e1a4d;
      --text: #f4f2ff; --text-dim: rgba(244,242,255,.62);
      --accent: #7c6cf6; --accent2: #a78bfa;
      --glass: rgba(255,255,255,.09); --glass-brd: rgba(255,255,255,.16);
      --danger: #f87171; --ok: #34d399;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;
      background:radial-gradient(120% 90% at 50% 0%, var(--bg2) 0%, var(--bg1) 45%, var(--bg0) 100%);
      color:var(--text); min-height:100dvh; display:flex; flex-direction:column;
      padding-bottom:env(safe-area-inset-bottom);
    }
    .bg-blur { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
    .bg-blur img { width:100%; height:100%; object-fit:cover; filter:blur(70px) saturate(1.6) brightness(.45); transform:scale(1.25); opacity:.7; }
    header {
      z-index:2; display:flex; align-items:center; justify-content:space-between;
      padding:14px 18px; font-weight:800; letter-spacing:.02em; font-size:16px;
    }
    .status { display:flex; align-items:center; gap:7px; font-size:11px; font-weight:700; color:var(--text-dim); letter-spacing:.08em; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--danger); }
    .status.on .dot { background:var(--ok); box-shadow:0 0 8px var(--ok); }
    main { z-index:1; flex:1; width:100%; max-width:480px; margin:0 auto; padding:6px 18px 18px; display:flex; flex-direction:column; gap:14px; }
    .cover {
      position:relative; width:100%; aspect-ratio:1/1; border-radius:26px; overflow:hidden;
      background:linear-gradient(135deg, rgba(124,108,246,.25), rgba(167,139,250,.08));
      box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 90px rgba(124,108,246,.18);
    }
    .cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .cover .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:96px; opacity:.35; }
    .cover .phErr { position:absolute; left:0; right:0; bottom:12px; text-align:center; font-size:11px; color:var(--danger); z-index:3; display:none; }
    .shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(5,3,18,0) 45%, rgba(5,3,18,.55) 100%); pointer-events:none; }
    .ov { position:absolute; display:flex; gap:10px; z-index:2; }
    .ov.center { left:0; right:0; bottom:18px; justify-content:center; align-items:center; }
    .cbtn {
      border:1px solid var(--glass-brd); background:rgba(20,14,50,.55); color:#fff;
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
      border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:transform .12s ease, background .12s ease;
    }
    .cbtn:active { transform:scale(.9); }
    .cbtn svg { fill:currentColor; }
    /* Лайк: контур → заливка. Раньше .cbtn svg{fill:currentColor} заливал сердце
       ВСЕГДА, поэтому «лайкнутого» трека нельзя было отличить от обычного. */
    #likeBtn svg { fill:none; stroke:currentColor; stroke-width:2; }
    #likeBtn.liked svg { fill:currentColor; stroke:currentColor; }
    @keyframes ping { 0%{transform:scale(1)} 40%{transform:scale(1.28)} 100%{transform:scale(1)} }
    #likeBtn.ping { animation:ping .32s ease; }
    .cbtn.nav { width:52px; height:52px; }
    .cbtn.nav svg { width:26px; height:26px; }
    .cbtn.play { width:74px; height:74px; background:rgba(255,255,255,.92); color:#17122f; border:none; box-shadow:0 8px 30px rgba(0,0,0,.45); }
    .cbtn.play svg { width:32px; height:32px; }
    .ov.corner { top:12px; right:12px; }
    .ov.bl { left:12px; bottom:12px; }
    .ov.br { right:12px; bottom:12px; }
    .cbtn.mini { width:44px; height:44px; font-size:18px; }
    .cbtn.mini svg { width:20px; height:20px; }
    .cbtn.liked { color:#f472b6; border-color:rgba(244,114,182,.6); }
    .tinfo { text-align:left; display:flex; gap:12px; align-items:center; }
    .tinfo .ava { width:52px; height:52px; border-radius:50%; object-fit:cover; flex-shrink:0; background:rgba(255,255,255,.1); }
    .tinfo .tt { font-size:21px; font-weight:800; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tinfo .ta { font-size:14px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .prog { display:flex; flex-direction:column; gap:6px; }
    .times { display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
    input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:22px; background:transparent; cursor:pointer; }
    input[type=range]::-webkit-slider-runnable-track { height:5px; border-radius:3px; background:linear-gradient(90deg, var(--accent) var(--fill,0%), rgba(255,255,255,.18) var(--fill,0%)); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; margin-top:-7.5px; border-radius:50%; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.5); }
    input[type=range]::-moz-range-track { height:5px; border-radius:3px; background:rgba(255,255,255,.18); }
    input[type=range]::-moz-range-progress { height:5px; border-radius:3px; background:var(--accent); }
    input[type=range]::-moz-range-thumb { width:20px; height:20px; border:none; border-radius:50%; background:#fff; }
    .row { display:flex; align-items:center; gap:10px; }
    .row.space { justify-content:space-between; }
    .tbtn {
      border:1px solid transparent; background:transparent; color:var(--text-dim);
      width:44px; height:44px; border-radius:12px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .tbtn svg { width:22px; height:22px; fill:currentColor; }
    .tbtn.on { color:var(--accent2); background:var(--glass); border-color:var(--glass-brd); }
    .tbtn:active { transform:scale(.92); }
    .vol { flex:1; display:flex; align-items:center; gap:8px; color:var(--text-dim); }
    .vol svg { width:20px; height:20px; fill:currentColor; flex-shrink:0; }
    .vol b { font-size:12px; min-width:34px; text-align:right; font-variant-numeric:tabular-nums; }
    .backdrop { position:fixed; inset:0; z-index:9; background:rgba(3,2,12,.6); opacity:0; pointer-events:none; transition:opacity .25s ease; }
    .backdrop.show { opacity:1; pointer-events:auto; }
    .sheet {
      position:fixed; z-index:10; left:0; right:0; bottom:0; max-width:560px; margin:0 auto;
      max-height:72dvh; display:flex; flex-direction:column;
      background:rgba(24,19,58,.96); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
      border:1px solid var(--glass-brd); border-bottom:none; border-radius:22px 22px 0 0;
      transform:translateY(105%); transition:transform .28s ease;
      padding-bottom:env(safe-area-inset-bottom);
    }
    .sheet.show { transform:translateY(0); }
    .sheet header { padding:14px 18px 10px; display:flex; align-items:center; justify-content:space-between; }
    .sheet h2 { font-size:15px; font-weight:800; }
    .qx { border:none; background:var(--glass); color:var(--text); width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; }
    .qlist { overflow-y:auto; padding:0 8px 14px; }
    .qrow { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; font-size:14px; }
    .qrow img.qc { width:40px; height:40px; border-radius:8px; object-fit:cover; flex-shrink:0; background:rgba(255,255,255,.08); }
    .qrow.cur { background:rgba(124,108,246,.18); }
    .qrow.cur .qt { color:var(--accent2); font-weight:700; }
    .qrow.cur .qn { color:var(--accent2); }
    .qn { color:var(--text-dim); min-width:26px; font-variant-numeric:tabular-nums; }
    .qt { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .qempty { text-align:center; color:var(--text-dim); padding:26px; font-size:14px; }
    @media (min-width:720px) {
      main { max-width:520px; }
      .cover { border-radius:30px; }
    }
    /* ---- Десктоп: полноэкранный вид, как у фуллскрин-плеера ----
       Раньше страница на мониторе оставалась узкой «телефонной» колонкой
       520px с пустым местом по бокам. */
    @media (min-width:900px) and (min-height:560px) {
      body { overflow:hidden; }
      .bg-blur img { filter:blur(90px) saturate(1.7) brightness(.38); }
      main {
        max-width:1500px; height:100dvh; padding:0 clamp(24px,4vw,64px);
        display:grid; gap:clamp(10px,1.6vh,18px) clamp(24px,4vw,64px);
        grid-template-columns:minmax(300px,1.05fr) minmax(340px,.95fr);
        /* Ряды 1fr по краям — распорки: правая колонка (инфо / прогресс /
           кнопки) сжимается к центру и не растягивается на высоту обложки.
           Без них auto-ряды росли под спан обложки и между блоками были дыры. */
        grid-template-rows:1fr auto auto 1fr;
        align-content:stretch; justify-items:stretch;
      }
      .cover {
        grid-column:1; grid-row:1 / span 4; align-self:center; justify-self:center;
        width:min(100%, 70dvh, 680px); height:auto; aspect-ratio:1/1;
        border-radius:32px; max-height:none;
      }
      .tinfo { grid-column:2; grid-row:2; align-self:end; text-align:center; align-items:center; gap:16px; }
      .tinfo .ava { width:80px; height:80px; }
      .tinfo .tt { font-size:38px; white-space:normal; }
      .tinfo .ta { font-size:17px; white-space:normal; }
      .prog { grid-column:2; grid-row:3; align-self:center; width:100%; max-width:640px; justify-self:center; gap:10px; }
      .row.space { grid-column:2; grid-row:4; align-self:start; justify-content:center; gap:clamp(16px,2.4vw,32px); width:100%; max-width:640px; justify-self:center; }
      input[type=range] { height:26px; }
      .times { font-size:13px; }
      .cbtn.nav { width:64px; height:64px; }
      .cbtn.nav svg { width:32px; height:32px; }
      .cbtn.play { width:92px; height:92px; }
      .cbtn.play svg { width:40px; height:40px; }
      .cbtn.mini { width:54px; height:54px; }
      .cbtn.mini svg { width:26px; height:26px; }
      .tbtn { width:54px; height:54px; }
      .tbtn svg { width:26px; height:26px; }
      .vol { max-width:280px; }
      input[type=range]#volSlider { height:24px; }
      .vol b { font-size:14px; min-width:42px; }
      /* Очередь на десктопе — правая колонка, а не шторка снизу */
      .sheet { left:auto; right:clamp(24px,4vw,64px); bottom:50%; transform:translateY(50%) translateX(110%);
        width:min(560px,42vw); max-height:80dvh; border-radius:26px; border-bottom:1px solid var(--glass-brd); }
      .sheet.show { transform:translateY(50%) translateX(0); }
      .qrow img.qc { width:52px; height:52px; border-radius:10px; }
      .qrow { font-size:15px; padding:12px 14px; }
      .qn { min-width:32px; }
    }
  </style>
</head>
<body>
  <div class="bg-blur" id="bgBlur"></div>
  <header>
    <div>KumaFlow</div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">CONNECTING</span></div>
  </header>
  <main>
    <div class="cover" id="coverBox">
      <div class="ph" id="coverPh">🎵</div>
      <div class="phErr" id="coverErr">обложка не загрузилась</div>
      <div class="shade"></div>
      <div class="ov corner">
        <button class="cbtn mini" id="queueBtn" title="Очередь">
          <svg viewBox="0 0 24 24"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
        </button>
      </div>
      <div class="ov center">
        <button class="cbtn nav" id="prevBtn" title="Назад">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="cbtn play" id="playBtn" title="Играть/пауза">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="cbtn nav" id="nextBtn" title="Вперёд">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div class="ov bl">
        <button class="cbtn mini" id="likeBtn" title="Нравится">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
      </div>
      <div class="ov br">
        <button class="cbtn mini" id="dislikeBtn" title="Не нравится">
          <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
        </button>
      </div>
    </div>
    <div class="tinfo">
      <img class="ava" id="avaImg" alt="" style="display:none">
      <div style="flex:1;min-width:0">
        <div class="tt" id="trackTitle">Нет трека</div>
        <div class="ta" id="trackArtist"></div>
      </div>
    </div>
    <div class="prog">
      <input type="range" id="posSlider" min="0" max="100" value="0" step="0.1" aria-label="Позиция">
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>
    <div class="row space">
      <button class="tbtn" id="shuffleBtn" title="Перемешать">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="tbtn" id="repeatBtn" title="Повтор">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
      <div class="vol">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <input type="range" id="volSlider" min="0" max="100" value="50" aria-label="Громкость">
        <b id="volVal">50</b>
      </div>
    </div>
  </main>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <header><h2>Очередь воспроизведения</h2><button class="qx" id="queueClose">✕</button></header>
    <div class="qlist" id="queueList"><div class="qempty">Загрузка очереди...</div></div>
  </div>
  <script>
    var ws, tickTimer = null;
    var S = { isPlaying:false, title:'', artist:'', album:'', coverArt:'', duration:0, progress:0, volume:50, isShuffle:false, repeatMode:'off', isLiked:false };
    var shownCover = null;   // URL, который уже лежит в DOM
    var pendingCover = null; // URL, который сейчас грузится (иначе каждые 2с новый Image)
    function $(id) { return document.getElementById(id); }
    function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
    function send(ev, data) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ event: ev, data: data })); }
    function setFill(el, pct) { el.style.setProperty('--fill', Math.min(100, Math.max(0, pct)) + '%'); }

    /* Обложка приходит с десктопа относительным путём (/getCoverArt?id=...).
       Собираем абсолютный URL через new URL — он корректен для любого origin
       (и для IPv6, где ручная склейка 'http://' + host ломалась).
       PIN из адреса страницы добавляем в запрос: картинка перестанет зависеть
       от того, проверяет ли сервер пин на /getCoverArt. */
    function coverUrl(u) {
      if (!u) return '';
      var abs;
      try { abs = new URL(u, window.location.href).href; } catch (e) { abs = u; }
      var pin = new URLSearchParams(window.location.search).get('pin');
      if (pin && abs.indexOf('pin=') < 0) abs += (abs.indexOf('?') >= 0 ? '&' : '?') + 'pin=' + encodeURIComponent(pin);
      return abs;
    }

    function connect() {
      // PIN из адреса страницы (?pin=) пробрасываем в WebSocket
      var wsUrl = 'ws://' + window.location.hostname + ':' + window.location.port + '/remote-ws' + window.location.search;
      ws = new WebSocket(wsUrl);
      ws.onopen = function() {
        $('status').classList.add('on'); $('statusText').textContent = 'CONNECTED';
        send('get-state');
        if (tickTimer) clearInterval(tickTimer);
        tickTimer = setInterval(tick, 1000);
      };
      ws.onmessage = function(e) {
        try {
          var msg = JSON.parse(e.data);
          if (msg.event === 'state-update' && msg.data) { for (var k in msg.data) S[k] = msg.data[k]; render(); }
          if (msg.event === 'queue-update' && msg.data) renderQueue(msg.data);
        } catch (err) { /* ignore */ }
      };
      ws.onclose = function(e) {
        $('status').classList.remove('on');
        if (tickTimer) clearInterval(tickTimer);
        if (e && e.code === 4401) {
          $('statusText').textContent = 'BAD PIN';
          document.body.innerHTML = '<div style="display:flex;height:100dvh;align-items:center;justify-content:center;font-family:sans-serif;text-align:center;padding:24px">🔒 Неверный PIN.<br><a href="/" style="color:#a78bfa">Войти заново</a></div>';
          return;
        }
        $('statusText').textContent = 'RECONNECTING';
        setTimeout(connect, 3000);
      };
      ws.onerror = function() { $('status').classList.remove('on'); $('statusText').textContent = 'ERROR'; };
    }

    function render() {
      var box = $('coverBox');
      var url = coverUrl(S.coverArt);
      if (url && url !== shownCover && url !== pendingCover) {
        pendingCover = url;
        var img = new Image();
        img.className = 'coverart';
        img.alt = '';
        img.onload = function() {
          pendingCover = null; shownCover = url;
          var old = box.querySelector('img.coverart');
          if (old) old.parentNode.removeChild(old);
          box.insertBefore(img, box.firstChild);
          $('coverPh').style.display = 'none';
          $('coverErr').style.display = 'none';
          var bg = $('bgBlur'); bg.innerHTML = '';
          var b = document.createElement('img'); b.alt = ''; b.src = url; bg.appendChild(b);
          var av = $('avaImg'); av.src = url; av.style.display = 'block';
        };
        img.onerror = function() {
          pendingCover = null;
          // Раньше ошибка молча возвращала заглушку — непонятно было, грузится
          // обложка или нет. Теперь это видно на странице.
          $('coverPh').style.display = 'flex';
          $('coverErr').style.display = 'block';
          $('bgBlur').innerHTML = ''; $('avaImg').style.display = 'none';
          shownCover = null; // следующий state-update попробует ещё раз
        };
        img.src = url;
      } else if (!url) {
        var old2 = box.querySelector('img.coverart');
        if (old2) old2.parentNode.removeChild(old2);
        shownCover = null; pendingCover = null;
        $('coverPh').style.display = 'flex';
        $('coverErr').style.display = 'none';
        $('bgBlur').innerHTML = ''; $('avaImg').style.display = 'none';
      }
      $('trackTitle').textContent = S.title || 'Нет трека';
      var sub = [S.artist, S.album].filter(Boolean).join(' • ');
      $('trackArtist').textContent = sub;
      $('playIcon').style.display = S.isPlaying ? 'none' : 'block';
      $('pauseIcon').style.display = S.isPlaying ? 'block' : 'none';
      var dur = S.duration || 0, pr = S.progress || 0;
      $('tCur').textContent = fmt(pr); $('tDur').textContent = fmt(dur);
      var pct = dur > 0 ? (pr / dur) * 100 : 0;
      var ps = $('posSlider'); ps.value = pct; setFill(ps, pct);
      var v = Math.round(S.volume || 0);
      var vs = $('volSlider'); vs.value = v; setFill(vs, v);
      $('volVal').textContent = v;
      $('shuffleBtn').classList.toggle('on', !!S.isShuffle);
      $('repeatBtn').classList.toggle('on', S.repeatMode && S.repeatMode !== 'off');
      var lb = $('likeBtn');
      var wasLiked = lb.classList.contains('liked');
      lb.classList.toggle('liked', !!S.isLiked);
      if (S.isLiked && !wasLiked) {
        lb.classList.remove('ping');
        void lb.offsetWidth;   // перезапуск анимации
        lb.classList.add('ping');
      }
    }

    function tick() {
      if (S.isPlaying && S.duration > 0) {
        S.progress = Math.min(S.duration, (S.progress || 0) + 1);
        $('tCur').textContent = fmt(S.progress);
        var pct = (S.progress / S.duration) * 100;
        var ps = $('posSlider');
        if (document.activeElement !== ps) { ps.value = pct; setFill(ps, pct); }
      }
    }

    function renderQueue(q) {
      var list = $('queueList');
      if (!q || !q.length) { list.innerHTML = '<div class="qempty">Очередь пуста</div>'; return; }
      // Перерисовка через innerHTML сбрасывала scrollTop в 0 — текущий трек
      // (обычно это 20–30-я строка) уезжал за экран и не было видно, где мы.
      var keepScroll = list.scrollTop;
      var prevActive = queueActiveIndex;
      var html = '';
      for (var i = 0; i < q.length; i++) {
        var t = q[i];
        var act = !!t.active;
        if (act) queueActiveIndex = i;
        html += '<div class="qrow' + (act ? ' cur' : '') + '" data-i="' + i + '"><span class="qn">' + (i+1) + '</span>' +
          (t.coverArt ? '<img class="qc" loading="lazy" alt="" src="' + escapeHtml(coverUrl(t.coverArt)) + '">' : '') +
          '<span class="qt">' + escapeHtml(t.title || 'Unknown') + (t.artist ? ' — ' + escapeHtml(t.artist) : '') + '</span></div>';
      }
      list.innerHTML = html;
      // Если трек не менялся — держим позицию пользователя, иначе он теряет
      // место, куда сам прокрутил.
      if (prevActive === queueActiveIndex && keepScroll > 0) list.scrollTop = keepScroll;
      else scrollQueueToActive();
    }
    var queueActiveIndex = -1;
    function scrollQueueToActive() {
      var list = $('queueList');
      var cur = list.querySelector('.qrow.cur');
      if (!cur) return;
      // По центру, иначе на длинной очереди текущий трек не попадает в вид.
      var target = cur.offsetTop - (list.clientHeight / 2) + (cur.offsetHeight / 2);
      list.scrollTop = Math.max(0, target);
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

    var sheetOpen = false;
    function setSheet(open) {
      sheetOpen = open;
      $('sheet').classList.toggle('show', open);
      $('backdrop').classList.toggle('show', open);
      if (open) { send('get-queue'); scrollQueueToActive(); }
    }

    $('playBtn').onclick = function() { send('toggle'); };
    $('prevBtn').onclick = function() { send('previous'); };
    $('nextBtn').onclick = function() { send('next'); };
    $('likeBtn').onclick = function() { send('like'); };
    $('dislikeBtn').onclick = function() { send('dislike'); };
    // Раньше эти кнопки слали событие БЕЗ данных, а плеер ждёт payload.enabled /
    // payload.mode — из-за этого shuffle и repeat не делали ровно ничего.
    $('shuffleBtn').onclick = function() { send('shuffle', { enabled: !S.isShuffle }); };
    $('repeatBtn').onclick = function() {
      var modes = ['off', 'all', 'one'];
      var next = modes[(modes.indexOf(S.repeatMode || 'off') + 1) % modes.length];
      send('repeat', { mode: next });
    };
    $('queueBtn').onclick = function() { setSheet(!sheetOpen); };
    $('queueClose').onclick = function() { setSheet(false); };
    $('backdrop').onclick = function() { setSheet(false); };
    $('posSlider').addEventListener('change', function(e) {
      if (S.duration > 0) send('position', { position: (parseFloat(e.target.value) / 100) * S.duration });
    });
    $('posSlider').addEventListener('input', function(e) { setFill(e.target, parseFloat(e.target.value)); });
    $('volSlider').addEventListener('input', function(e) {
      var v = parseInt(e.target.value, 10);
      setFill(e.target, v); $('volVal').textContent = v;
      send('volume', { value: v });
    });

    connect();
  </script>
</body>
</html>
